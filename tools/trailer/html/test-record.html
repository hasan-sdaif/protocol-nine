<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<style>
@font-face{font-family:'Cairo';src:url('../assets/fonts/cairo-arabic-900.woff2') format('woff2');font-weight:900;font-style:normal}
@font-face{font-family:'Cairo';src:url('../assets/fonts/cairo-latin-900.woff2') format('woff2');font-weight:900;font-style:normal}
@font-face{font-family:'Orbitron';src:url('../assets/fonts/orbitron-900.woff2') format('woff2');font-weight:900}
html,body{margin:0;padding:0;background:#05070c;width:1080px;height:1920px;overflow:hidden}
.stage{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;font-family:'Cairo',sans-serif}
#t1{color:#7fd4ff;font-weight:900;font-size:120px;text-shadow:0 0 60px rgba(127,212,255,.4)}
#t2{color:#fff;font-weight:900;font-size:200px}
#t3{font-family:'Orbitron';color:#f5b04c;font-size:72px;letter-spacing:12px}
#box{width:300px;height:300px;border:6px solid #7fd4ff;border-radius:40px;background:rgba(127,212,255,.08)}
#timer{position:absolute;top:40px;left:40px;font-family:'Orbitron';color:#fff;font-size:48px}
</style>
<script src="../assets/gsap.min.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <div id="timer">0.0</div>
  <div id="t1">بروتوكول التاسع</div>
  <div id="t2">هل تجرؤ؟</div>
  <div id="t3">PROTOCOL NINE</div>
  <div id="box"></div>
</div>
<script>
const tl = gsap.timeline({paused:true});
tl.fromTo('#t1',{opacity:0,y:80},{opacity:1,y:0,duration:.25,ease:'back.out(2)'},0.5)
  .fromTo('#t2',{opacity:0,scale:2.4},{opacity:1,scale:1,duration:.4,ease:'power4.out'},1.2)
  .fromTo('#t3',{opacity:0},{opacity:1,duration:.3},1.8)
  .fromTo('#box',{opacity:0,scale:.5,rotate:-25},{opacity:1,scale:1,rotate:0,duration:.45,ease:'back.out(1.7)'},2.3)
  .to('#box',{y:-60,duration:.5,ease:'power2.inOut',yoyo:true,repeat:1},3.2);
const t0 = performance.now();
function loop(){
  const t = (performance.now()-t0)/1000;
  document.getElementById('timer').textContent = t.toFixed(1);
  tl.time(t);
  if(t < 6) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
