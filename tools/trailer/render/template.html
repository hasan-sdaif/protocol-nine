<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
/* ═══ الخطوط (مضمّنة base64 — لا اعتماديات خارجية) ═══ */
@font-face{font-family:'CairoA';src:url(data:font/woff2;base64,__F_CAIRO_AR__) format('woff2');font-weight:900}
@font-face{font-family:'CairoL';src:url(data:font/woff2;base64,__F_CAIRO_LA__) format('woff2');font-weight:900}
@font-face{font-family:'CairoA7';src:url(data:font/woff2;base64,__F_CAIRO_AR7__) format('woff2');font-weight:700}
@font-face{font-family:'Orbitron';src:url(data:font/woff2;base64,__F_ORBITRON__) format('woff2');font-weight:900}
@font-face{font-family:'JBMono';src:url(data:font/woff2;base64,__F_JBMONO__) format('woff2');font-weight:700}

:root{
  --ac:__ACCENT__;
  --ac-glow:__ACCENT_GLOW__;
  --ac-dim:__ACCENT_DIM__;
  --w:__W__px; --h:__H__px;
__VARS__
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);background:#000;overflow:hidden}
body{font-family:'CairoA','CairoL',sans-serif;color:#e8f2ff;-webkit-font-smoothing:antialiased}

/* ═══ شاشة البداية (نقرة المزامنة — سوداء نقية) ═══ */
#go{position:fixed;inset:0;background:#000;z-index:99;cursor:pointer}

#stage{position:relative;width:var(--w);height:var(--h);background:#05070c;overflow:hidden;opacity:0}

/* ═══ الخلفية ═══ */
#bg{position:absolute;inset:0;
  background:
    radial-gradient(120% 70% at 50% 34%, var(--ac-glow) 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 100%, rgba(4,8,14,.9) 0%, transparent 70%),
    #05070c}
#grid{position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(140,190,230,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(140,190,230,.055) 1px,transparent 1px);
  background-size:96px 96px}
#gridFlash{position:absolute;inset:0;opacity:0;
  background-image:
    linear-gradient(var(--ac-dim) 1px,transparent 1px),
    linear-gradient(90deg,var(--ac-dim) 1px,transparent 1px);
  background-size:96px 96px}
#vig{position:absolute;inset:0;background:radial-gradient(75% 75% at 50% 46%,transparent 55%,rgba(2,4,8,.88) 100%)}
#flash{position:absolute;inset:0;background:var(--ac);opacity:0;z-index:50;pointer-events:none}

/* ═══ الهوية ═══ */
#brand{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-top:__BRAND_PT__;opacity:.9;z-index:5}
#brand .ar{font-size:__BRAND_AR__px;font-weight:900;letter-spacing:.5px;color:#dcecff;text-shadow:0 0 30px var(--ac-glow)}
#brand .lat{font-family:'Orbitron';font-size:__BRAND_LA__px;letter-spacing:8px;color:var(--ac);opacity:.85}
#brand svg{display:block}

/* ═══ شريط التقدم ═══ */
#progWrap{position:absolute;left:__PROG_MX__;right:__PROG_MX__;bottom:__PROG_BM__;z-index:5}
#progLabel{display:flex;justify-content:space-between;font-family:'Orbitron';font-size:__PROG_FS__px;color:#9db8d4;letter-spacing:2px;direction:ltr;margin-bottom:10px;opacity:.85}
#progTrack{height:5px;background:rgba(140,190,230,.14);border-radius:99px;overflow:hidden}
#progBar{height:100%;width:0%;background:linear-gradient(90deg,var(--ac-dim),var(--ac));border-radius:99px;box-shadow:0 0 18px var(--ac-glow)}

/* ═══ الكابشن (كاراوكي) ═══ */
#caps{position:absolute;left:__CAP_MX__;right:__CAP_MX__;top:__CAP_TOP__;height:300px;z-index:6;pointer-events:none}
.capline{position:absolute;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 16px;opacity:0;
  background:rgba(3,6,12,.55);border:1px solid rgba(140,190,230,.1);border-radius:20px;padding:14px 30px;
  backdrop-filter:blur(2px)}
.capline .w{font-size:__CAP_FS__px;font-weight:900;color:#e8f2ff;line-height:1.5;transition:none;display:inline-block}

/* ═══ نظام المشاهد ═══ */
#scenes{position:absolute;inset:0;z-index:3}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:__SCENE_GAP__;padding:__SCENE_PAD__}
.scene .k{font-size:__K_FS__px;font-weight:900;color:#fff}
.scene .sub{font-size:__SUB_FS__px;font-weight:900;color:#b9d2ec}
.scene .glow{color:var(--ac);text-shadow:0 0 44px var(--ac-glow)}
.scene .lat{font-family:'Orbitron';direction:ltr}
.scene .mono{font-family:'JBMono';direction:ltr}
.card{position:relative;background:linear-gradient(160deg,rgba(10,16,26,.92),rgba(6,10,18,.86));
  border:1.5px solid var(--ac-dim);border-radius:__CARD_R__px;padding:__CARD_PAD__;
  box-shadow:0 0 90px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.06)}
.card::before{content:'';position:absolute;inset:8px;border:1px solid rgba(140,190,230,.09);border-radius:calc(__CARD_R__px - 8px);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:12px;background:rgba(9,14,24,.9);border:1.5px solid var(--ac-dim);
  border-radius:99px;padding:12px 34px;font-size:__CHIP_FS__px;font-weight:900;color:#eaf4ff;
  box-shadow:0 0 26px rgba(0,0,0,.4)}
.chip svg{flex:none}
.num{font-family:'Orbitron';direction:ltr;font-weight:900;color:var(--ac);text-shadow:0 0 56px var(--ac-glow)}
.tag{font-family:'JBMono';direction:ltr;font-size:__TAG_FS__px;color:#8fb4d8;letter-spacing:3px}
.iconBig{filter:drop-shadow(0 0 34px var(--ac-glow))}
.ring{position:absolute;border:2px solid var(--ac-dim);border-radius:50%}
</style>
</head>
<body>
<div id="go"></div>
<div id="stage">
  <div id="bg"></div><div id="grid"></div><div id="gridFlash"></div><div id="vig"></div>

  <div id="brand">
    <span id="brandLogo"></span>
    <div class="ar">البروتوكول التاسع</div>
    <div class="lat">PROTOCOL NINE</div>
  </div>

  <div id="scenes"></div>
  <div id="caps"></div>

  <div id="progWrap">
    <div id="progLabel"><span id="plNow">00:00</span><span id="plTotal">00:00</span></div>
    <div id="progTrack"><div id="progBar"></div></div>
  </div>

  <div id="flash"></div>
</div>

<script>__GSAP__</script>
<script>
/* ═══════════ البيانات ═══════════ */
const TL = __TL_JSON__;
const ACC = TL.accent, ACCG = TL.accentDim, LAND = TL.orientation === "landscape";
const $ = (s, p) => (p || document).querySelector(s);
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

/* ═══════════ مكتبة الأيقونات SVG (لا إيموجي إطلاقاً) ═══════════ */
const P = {

  brain: '<path d="M9.5 3.5A3 3 0 006.6 7 3 3 0 005 9.8a3 3 0 001.2 2.4A3 3 0 008.6 17c.4 1.8 1.8 3.5 3.4 3.5V3.5a2.6 2.6 0 00-2.5 0z"/><path d="M14.5 3.5A3 3 0 0117.4 7 3 3 0 0119 9.8a3 3 0 01-1.2 2.4A3 3 0 0115.4 17c-.4 1.8-1.8 3.5-3.4 3.5"/>',

  stamp: '<path d="M9 13.5h6l1.5 4h-9zM10 13.5V9a2 2 0 114 0v4.5"/><path d="M5.5 20.5h13"/>',

  moon: '<path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/>',

  check: '<path d="M4.5 12.8l5 5L19.5 6.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  alert: '<path d="M12 3.5l9.5 17H2.5z"/><path d="M12 10v4.5M12 17.6v.4"/>',
  terminal: '<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 9.5l3 3-3 3M12.5 15.5H17"/>',

  layers: '<path d="M12 3.5l8.5 4.5L12 12.5 3.5 8z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>',

  users: '<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16 14.6c2.8.2 5 2 5.5 4.9"/>',

function ic(name, size, sw) {
  const p = P[name] || P.hex;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || Math.max(1.4, Number(size) / 16)) + '" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
}

/* ═══════════ أدوات بناء المشهد ═══════════ */
const stage = $('#stage'), scenesEl = $('#scenes'), capsEl = $('#caps');
function hex9(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-linejoin="round">' +
    '<path d="M12 2.5l8.2 4.7v9.6L12 21.5l-8.2-4.7V7.2z"/>' +
    '<text x="12" y="16" text-anchor="middle" font-family="Orbitron" font-size="10.5" font-weight="900" fill="var(--ac)" stroke="none">9</text></svg>';
}

/* كل مشهد: (data) => { html, anim(layer, tl, dur) } */
const SC = {};

/* ── عام ── */
SC.titleSlam = () => ({
  html: '<div style="text-align:center">' +
    '<div class="k" style="font-size:var(--fs-title);line-height:1.2">بروتوكول <span class="glow">التاسع</span></div>' +
    '<div class="lat" style="font-size:var(--fs-title-lat);letter-spacing:14px;color:var(--ac);margin-top:22px;text-shadow:0 0 40px var(--ac-glow)">PROTOCOL NINE</div></div>',
  anim(l, t, d) {
    t.fromTo(l.querySelector('.k'), { scale: 3.2, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'power4.out' }, .1)
      .fromTo(l.querySelector('.lat'), { opacity: 0, letterSpacing: '34px' }, { opacity: 1, letterSpacing: '14px', duration: .6, ease: 'power2.out' }, .35)
      .to(l, { scale: 1.015, duration: Math.max(.5, d - 1.2), ease: 'none' }, .8);
  }
});
SC.endCard = (data) => ({
  html: '<div style="display:flex;flex-direction:column;align-items:center;gap:var(--gap-lg)">' + hex9('var(--icon-logo)') +
    '<div class="k glow" style="font-size:var(--fs-end)">' + (data.line || 'ما نُسي... ينتظر.') + '</div>' +
    '<div class="sub" style="font-size:var(--fs-sub)">الرابط في الوصف</div>' +
    '<div class="tag" style="margin-top:6px">PROTOCOL-NINE // UOB</div></div>',
  anim(l, t) {
    const kids = l.children;
    t.fromTo(kids[0], { scale: 0, rotate: -120 }, { scale: 1, rotate: 0, duration: .6, ease: 'back.out(2)' }, .1)
      .fromTo(kids[1], { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'power3.out' }, .35)
      .fromTo([kids[2], kids[3]], { opacity: 0 }, { opacity: 1, duration: .4, stagger: .15 }, .7)
      .to(kids[0], { filter: 'drop-shadow(0 0 40px var(--ac-glow))', duration: .8 }, .6);
  }
});
SC.questionSlam = (data) => ({
  html: '<div class="k glow" style="font-size:var(--fs-q);line-height:1">' + (data.q || '؟') + '</div>' +
    '<div class="sub" style="font-size:var(--fs-sub)">جامعة البحرين</div>',
  anim(l, t) {
    t.fromTo(l.children[0], { scale: 4.5, opacity: 0, rotate: 8 }, { scale: 1, opacity: 1, rotate: 0, duration: .38, ease: 'power4.in' }, .05)
      .to(l.children[0], { x: -14, duration: .05, repeat: 5, yoyo: true, ease: 'none' }, .45)
      .fromTo(l.children[1], { opacity: 0 }, { opacity: 1, duration: .4 }, .6);
  }
});
SC.ctaCard = (data) => ({
  html: '<div class="card" style="text-align:center">' +
    '<div class="tag">' + (LAND ? 'ACCESS' : 'ادخل الآن') + '</div>' +
    '<div class="k glow" style="font-size:var(--fs-cta);margin:var(--gap-md) 0">' + (data.kw || 'بروتوكول التاسع') + '</div>' +
    '<div class="sub" style="font-size:var(--fs-sub)">' + (data.sub || 'الرابط في الوصف') + '</div>' +
    '<div style="color:var(--ac);margin-top:var(--gap-md);display:flex;justify-content:center">' + ic('arrowD', 'var(--icon-md)') + '</div></div>',
  anim(l, t, d) {
    t.fromTo(l.firstElementChild, { y: 90, opacity: 0, rotateX: 18 }, { y: 0, opacity: 1, rotateX: 0, duration: .55, ease: 'back.out(1.6)' }, .05)
      .to(l.querySelectorAll('svg'), { y: 16, duration: .5, repeat: Math.max(2, Math.floor((d - 1) / .5)), yoyo: true, ease: 'sine.inOut' }, .7)
      .to(l.firstElementChild, { boxShadow: '0 0 130px ' + ACCG, duration: .8, repeat: 1, yoyo: true }, .9);
  }
});
SC.bigStat = (data) => ({
  html: '<div style="text-align:center"><div class="num" style="font-size:var(--fs-stat)">' + (data.num || '26') + '</div>' +
    '<div class="k" style="font-size:var(--fs-sub);margin-top:var(--gap-md)">' + (data.label || '') + '</div></div>',
  anim(l, t) {

      .to(l.querySelector('.num'), { scale: 1.05, duration: .7, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1);
  }
});
SC.iconFocus = (data) => ({
  html: '<div style="position:relative;display:flex;align-items:center;justify-content:center;width:var(--if-w);height:var(--if-w)">' +

/* ═══════════ بناء الخط الرئيسي ═══════════ */
const master = gsap.timeline({ paused: true });

/* وميض البداية (علامة المزامنة + افتتاحية الإشارة) — مدّته ممدودة لرصد القصّ */
master.fromTo('#flash', { opacity: .55 }, { opacity: 0, duration: .9, ease: 'power2.out' }, 0);
master.fromTo('#stage', { opacity: 0 }, { opacity: 1, duration: .12, ease: 'none' }, 0);
master.fromTo('#gridFlash', { opacity: .5 }, { opacity: 0, duration: .7 }, 0);
master.fromTo('#brand', { y: -80, opacity: 0 }, { y: 0, opacity: .9, duration: .7, ease: 'power3.out' }, .3);

/* المشاهد */
const beats = [...TL.beats].sort((a, b) => a.t - b.t);
beats.forEach((b, i) => {
  const nextT = i + 1 < beats.length ? beats[i + 1].t : TL.duration;
  let dur = Math.min(nextT - b.t - 0.12, 7.5);
  if (dur < 1.4) dur = 1.4;
  const builder = SC[b.scene];
  if (!builder) return;
  const layer = el('div', 'scene');
  const built = builder(b.data || {}, {});
  layer.innerHTML = built.html;
  scenesEl.appendChild(layer);
  /* توحيد الجذر: جذر واحد غليف (ليس بطاقة) → مرّر أبناءه مباشرة للمشهد */
  let root = layer;
  if (layer.children.length === 1 && !(layer.children[0].classList.contains('card'))) {
    root = layer.children[0];
  }
  const local = gsap.timeline({ paused: false });
  built.anim(root, local, dur);
  master.add(local, b.t);
  master.fromTo(layer, { opacity: 0 }, { opacity: 1, duration: .32, ease: 'power1.out' }, b.t);
  master.to(layer, { opacity: 0, duration: .3, ease: 'power1.in' }, b.t + dur - .3);
});

/* الكابشن — كاراوكي بالكلمات */
const capUnits = TL.units.filter(u => u.cap && u.words && u.words.length);
let chunkIdx = 0;
capUnits.forEach(u => {
  const words = u.words;
  const chunks = [];
  let cur = [];
  let curChars = 0;
  for (const w of words) {
    if (cur.length >= 3 || curChars + w.text.length > 24) { if (cur.length) chunks.push(cur); cur = []; curChars = 0; }
    cur.push(w); curChars += w.text.length;
  }
  if (cur.length) chunks.push(cur);
  chunks.forEach(ch => {
    const line = el('div', 'capline');
    /* فتحات دورية — الأسطر المتتالية في مواضع مختلفة فلا تتصادم عند التقاطع */
    line.style.top = (chunkIdx++ % 3) * 96 + 'px';
    const spans = ch.map(w => { const s = el('span', 'w', w.text); line.appendChild(s); return s; });
    capsEl.appendChild(line);
    const t0 = ch[0].t, t1 = ch[ch.length - 1].t + ch[ch.length - 1].d;
    master.fromTo(line, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .22, ease: 'power2.out' }, Math.max(0, t0 - .05));
    ch.forEach((w, wi) => {
      master.fromTo(spans[wi], { color: '#e8f2ff', scale: 1 }, { color: ACC, scale: 1.07, duration: .07, ease: 'power1.out' }, Math.max(0, w.t));
      master.to(spans[wi], { color: '#e8f2ff', scale: 1, duration: .12 }, Math.max(0, w.t) + Math.min(w.d, .55));
    });
    master.to(line, { opacity: 0, y: -22, duration: .2, ease: 'power1.in' }, t1 + .25);
  });
});

/* شريط التقدم */
master.to('#progBar', { width: '100%', duration: TL.duration, ease: 'none' }, 0);

/* ═══════════ الساعة والمزامنة ═══════════ */
const plNow = $('#plNow'), plTotal = $('#plTotal');
const fmt = (s) => { const m = Math.floor(s / 60), r = Math.floor(s % 60); return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); };
plTotal.textContent = fmt(TL.duration);
$('#brandLogo').innerHTML = hex9('var(--icon-md)');

let t0 = null;
/* معامل تبطيء الزمن ts — التصوير البطيء ثم التسريع لاحقاً (يتيح ترميزاً أخف) */
const TS = Math.max(0.1, Math.min(1, parseFloat(new URLSearchParams(location.search).get('ts') || '1') || 1));
function frame(now) {
  if (t0 === null) return;
  const t = ((now - t0) / 1000) * TS;
  master.time(Math.min(t, TL.duration));
  plNow.textContent = fmt(Math.min(t, TL.duration));
  if (t < TL.duration + 0.8 / TS) requestAnimationFrame(frame);
  else plNow.textContent = fmt(TL.duration);
}
$('#go').addEventListener('click', () => {
  const go = $('#go');
  go.style.display = 'none';
  stage.style.opacity = '1';
  t0 = performance.now();
  requestAnimationFrame(frame);
}, { once: true });
</script>
